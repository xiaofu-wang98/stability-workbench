[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stability-data-hub"
version = "0.1.3"
description = "Incremental, traceable stability records and verified Office reports"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "openpyxl>=3.1.5,<4", "python-docx>=1.2,<2", "lxml>=5,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.27,<1"]

[project.scripts]
stability-hub = "stability_hub.cli:main"
stability-hub-server = "stability_hub.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
